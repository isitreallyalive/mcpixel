syntax = "proto3";

package block;

message PlacedBlock {
  string id = 1;
  bool top = 2;
}

message Block {
  PlacedBlock base = 1;
  optional PlacedBlock overlay = 2;
}

message Rgb {
  float r = 1;
  float g = 2;
  float b = 3;
}

message Weight {
  Rgb colour = 1;
  float weight = 2;
}

message BlockStats {
  Block block = 1;
  Rgb average = 2;
  repeated Weight weights = 3;
}

message Version {
  repeated BlockStats stats = 1;
}