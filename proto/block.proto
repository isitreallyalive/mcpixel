syntax = "proto3";

package block;

message PlacedBlock {
  string id = 1;
  bool top = 2;
}

message Block {
  PlacedBlock base = 1;
  optional PlacedBlock overlay = 2;
}

message Lab {
  float l = 1;
  float a = 2;
  float b = 3;
}

message Weight {
  Lab colour = 1;
  float weight = 2;
}

message BlockStats {
  Block block = 1;
  Lab average = 2;
  repeated Weight weights = 3;
}

message Version {
  repeated BlockStats stats = 1;
}