syntax = "proto3";

package block;

message Block {
  string base = 1;
  optional string overlay = 2;
}

message Rgb {
  float r = 1;
  float g = 2;
  float b = 3;
}

message Weight {
  Rgb colour = 1;
  float weight = 2;
}

message BlockStats {
  Block block = 1;
  Rgb average = 2;
  repeated Weight weights = 3;
}

message Version {
  repeated BlockStats stats = 1;
}