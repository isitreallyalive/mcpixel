[workspace]
resolver = "3"
default-members = ["mcpixel-cli"]
members = ["mcpixel", "mcpixel-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6.0", default-features = false }
directories = "6.0.0"
exoquant = "0.2.0"
image = { version = "0.25.10", default-features = false }
kiddo = "5.3.0"
mc_schem = "1.1.2"
mcpixel = { path = "mcpixel" }
miette = "7.6.0"
palette = "0.7.6"
prost = "0.14.3"
prost-build = "0.14.3"
thiserror = "2.0.18"
ureq = "3.3.0"
